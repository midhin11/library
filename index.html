<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceberg&family=Rubik+Distressed&display=swap" rel="stylesheet">
    <script src="js.js" defer></script>
</head>
<body>
    <div class="header">
        <div>LIBSTASH</div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="addbook">
                <button class="addbook-btn">Add Book</button>
                <form method="post" class="hidden">
                    <div>
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" placeholder="The name of the book" required>
                    </div>
                    <div>
                        <label for="author">Author</label>
                        <input type="text" id="author" name="author" placeholder="Who was it written by?" required>
                    </div>
                    <div>
                        <label for="pages">Pages</label>
                        <input type="number" id="pages" name="pages" placeholder="How many pages were there?" required>
                    </div>
                    <button type="submit" class="submit-data">Submit</button>
                </form>
            </div>
            
        </div>

        <div class="lib-section">
            <div class="cards">
                <div class="card">
                    <div class="title">
                        <div>Title:</div>
                        <div>The Lady of the Lake</div>
                    </div>
                    <div class="author">
                        <div>Written by:</div>
                        <div>Andrej Sapkowski</div>
                    </div>
                    <div class="pages">
                        <div>Pages:</div>
                        <div>298</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">DON'T LOSE YOUR SMILE! © 2026 Midhin Lal | Built with HTML, CSS, and JavaScript</div>
</body>
</html>
